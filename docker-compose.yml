services:
  qode-app:
    image: qode-neo4j:1.0
    container_name: qode-app
    ports:
      - "8501:8501"
    environment:
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      HF_TOKEN: ${HF_TOKEN}
      HF_BASE_URL: https://router.huggingface.co/v1
      HF_MODEL: zai-org/GLM-5.2:cheapest
      #HF_MODEL: Qwen/Qwen3-Embedding-8B
      #OPENAI_API_KEY: ${OPENAI_API_KEY}
      #OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      #OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-4o-mini}
      INPUT_PATH: /app/input
      CHROMA_PATH: /app/chroma_db
      GRAPH_PATH: /app/graph_db/qode_graph.json
      #HF_TOKEN: ${HF_TOKEN}
    volumes:
      - ./input:/app/input:ro
      - qode_chroma:/app/chroma_db
    networks:
      - kg-network
    restart: unless-stopped

volumes:
  qode_chroma:

networks:
  kg-network:
    external: true
